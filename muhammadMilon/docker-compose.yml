# Optional local PostgreSQL for Prisma (`npx prisma migrate dev`).
# Start: docker compose up -d
# Then set DATABASE_URL in .env.local to:
#   postgresql://nexora:nexora@localhost:5432/nexora?schema=public

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora
      POSTGRES_DB: nexora
    ports:
      - "5432:5432"
    volumes:
      - nexora_pgdata:/var/lib/postgresql/data

volumes:
  nexora_pgdata:
