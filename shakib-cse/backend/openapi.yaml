openapi: 3.0.3
info:
  title: FinanceApp API
  version: 1.0.0
  description: OpenAPI specification for core FinanceApp backend (auth, transactions, budgets, categories, users)
servers:
  - url: http://localhost:3030/api/v1
paths:
  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/refresh:
    post:
      summary: Refresh access token using httpOnly refresh cookie
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
  /auth/logout:
    post:
      summary: Logout and revoke refresh token
      responses:
        "200":
          description: Logged out
  /users/me:
    get:
      summary: Get current user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /transactions:
    get:
      summary: List transactions (paginated)
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: pageSize
          schema:
            type: integer
        - in: query
          name: start
          schema:
            type: string
            format: date
        - in: query
          name: end
          schema:
            type: string
            format: date
        - in: query
          name: type
          schema:
            type: string
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
                  meta:
                    type: object
    post:
      summary: Create transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
  /transactions/{id}:
    get:
      summary: Get transaction
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
    patch:
      summary: Update transaction
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTransactionRequest"
      responses:
        "200":
          description: Updated
    delete:
      summary: Delete transaction
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /budgets:
    get:
      summary: List budgets
      responses:
        "200":
          description: OK
    post:
      summary: Create budget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBudgetRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
  /categories:
    get:
      summary: List categories
      responses:
        "200":
          description: OK
components:
  schemas:
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        defaultCurrency:
          type: string
      required: [email, password, firstName, lastName]
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        accessToken:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
    CreateTransactionRequest:
      type: object
      properties:
        type:
          type: string
        amount:
          type: number
        currency:
          type: string
        date:
          type: string
          format: date
        categoryId:
          type: string
        accountId:
          type: string
        notes:
          type: string
      required: [type, amount, currency, date]
    UpdateTransactionRequest:
      type: object
      properties:
        amount:
          type: number
        date:
          type: string
          format: date
        notes:
          type: string
    Transaction:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        amount:
          type: number
        currency:
          type: string
        date:
          type: string
        categoryId:
          type: string
        accountId:
          type: string
        notes:
          type: string
    CreateBudgetRequest:
      type: object
      properties:
        name:
          type: string
        categoryId:
          type: string
        limitAmount:
          type: number
        currency:
          type: string
        period:
          type: string
          enum: [monthly, yearly]
        alertThreshold:
          type: integer
      required: [name, limitAmount, currency, period]
    Budget:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        categoryId:
          type: string
        limitAmount:
          type: number
        currency:
          type: string
        period:
          type: string
